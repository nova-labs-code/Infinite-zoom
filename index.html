<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Zoom</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="zoomCanvas"></canvas>

<script>
const canvas = document.getElementById("zoomCanvas");
const ctx = canvas.getContext("2d");

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

const img = new Image();
img.src = "images/1.png";

let scale = 1;
let offsetX = width / 2;
let offsetY = height / 2;

// Handle resizing
window.addEventListener("resize", () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

// Zoom with mouse wheel
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const zoomFactor = 1.1;
  const mouseX = e.clientX;
  const mouseY = e.clientY;

  // Adjust offsets so zoom is centered on cursor
  offsetX = mouseX - ((mouseX - offsetX) / scale) * (scale * (e.deltaY < 0 ? zoomFactor : 1/zoomFactor));
  offsetY = mouseY - ((mouseY - offsetY) / scale) * (scale * (e.deltaY < 0 ? zoomFactor : 1/zoomFactor));

  scale *= (e.deltaY < 0 ? zoomFactor : 1 / zoomFactor);
});

// Draw loop
function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  ctx.drawImage(img, -img.width/2, -img.height/2);
  ctx.restore();
  requestAnimationFrame(draw);
}

img.onload = () => {
  draw();
};
</script>
</body>
</html>
