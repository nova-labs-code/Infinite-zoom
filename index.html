<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Space Zoom</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:black; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="spaceCanvas"></canvas>

<script>
const canvas = document.getElementById("spaceCanvas");
const ctx = canvas.getContext("2d");
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

// Layers of space images (you can replace with your own)
const layers = [
  { src: "images/stars.png", scale: 1 },
  { src: "images/galaxy.png", scale: 0.5 },
  { src: "images/universe.png", scale: 0.2 }
];

layers.forEach(layer => {
  layer.img = new Image();
  layer.img.src = layer.src;
});

// Zoom control
let zoom = 1;
let offsetX = width/2;
let offsetY = height/2;

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const zoomFactor = 1.1;
  const mouseX = e.clientX;
  const mouseY = e.clientY;

  // Center zoom on cursor
  offsetX = mouseX - ((mouseX - offsetX)/zoom) * (zoom * (e.deltaY < 0 ? zoomFactor : 1/zoomFactor));
  offsetY = mouseY - ((mouseY - offsetY)/zoom) * (zoom * (e.deltaY < 0 ? zoomFactor : 1/zoomFactor));

  zoom *= (e.deltaY < 0 ? zoomFactor : 1/zoomFactor);
});

// Draw loop
function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(zoom, zoom);

  layers.forEach(layer => {
    const img = layer.img;
    const layerScale = layer.scale;

    if (!img.complete) return;

    // Draw multiple copies for seamless effect
    const w = img.width * layerScale;
    const h = img.height * layerScale;
    for (let x=-2; x<=2; x++) {
      for (let y=-2; y<=2; y++) {
        ctx.drawImage(img, x*w - w/2, y*h - h/2, w, h);
      }
    }
  });

  ctx.restore();
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
