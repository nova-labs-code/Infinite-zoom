<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Zoom Universe with Easter Eggs</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:black; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

// Camera
let camera = { x: width/2, y: height/2, zoom: 1 };

// Mouse wheel zoom
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const zoomFactor = 1.1;
  const mx = e.clientX;
  const my = e.clientY;

  camera.x = mx - ((mx - camera.x)/camera.zoom) * (camera.zoom * (e.deltaY < 0 ? zoomFactor : 1/zoomFactor));
  camera.y = my - ((my - camera.y)/camera.zoom) * (camera.zoom * (e.deltaY < 0 ? zoomFactor : 1/zoomFactor));
  camera.zoom *= (e.deltaY < 0 ? zoomFactor : 1 / zoomFactor);
});

// Procedural drawing
function drawStars(levelScale) {
  const count = Math.floor(200 * levelScale);
  for (let i=0; i<count; i++) {
    const x = (Math.random()-0.5) * width * 10;
    const y = (Math.random()-0.5) * height * 10;
    const size = Math.random() * 2 * levelScale;
    ctx.fillStyle = `rgba(255,255,255,${Math.random()})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawEasterEggs(levelScale) {
  const count = Math.floor(5 * levelScale); // few Easter eggs per zoom
  for (let i=0; i<count; i++) {
    const x = (Math.random()-0.5) * width * 10;
    const y = (Math.random()-0.5) * height * 10;
    ctx.fillStyle = "yellow";
    ctx.font = `${20 * levelScale}px Arial`;
    ctx.fillText("⭐", x, y); // Easter egg emoji
  }
}

// Recursive zoom layers
function drawLayer(level) {
  const levelScale = Math.pow(0.5, level); // smaller scales deeper
  drawStars(levelScale);
  if (level > 2) drawEasterEggs(levelScale);

  if (camera.zoom * levelScale > 0.5 && level < 10) {
    drawLayer(level + 1); // deeper zoom
  }
}

// Main loop
function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(camera.x, camera.y);
  ctx.scale(camera.zoom, camera.zoom);

  drawLayer(0);

  ctx.restore();
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
